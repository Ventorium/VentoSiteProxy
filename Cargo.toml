[package]
name = "ventositeproxy"
version = "0.1.0"
edition = "2021"
description = "VentoSiteProxy - Pingora based multi-site reverse proxy gateway with web admin"

[dependencies]
pingora = { version = "0.9.0", features = ["proxy", "rustls"] }
pingora-error = "0.9.0"
pingora-http = "0.9.0"
pingora-core = "0.9.0"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "~1.49", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
jsonwebtoken = "9"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
bytes = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
# 纯 Rust LDAP 客户端（P2 零信任 LDAP provider）
# default-features=false：不要 sync/tls-native(OpenSSL)；tls-rustls 使 ldaps:// 可用且适配 musl 静态构建
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# P3 零信任 MFA：TOTP（不启用 gen_secret，避免引入 rand 0.10；密钥用本项目 rand 0.8 生成）
totp-rs = { version = "6.0.0", features = ["otpauth", "qr"] }
# P3 零信任 MFA：passkey / WebAuthn（纯 Rust，musl 静态友好）
webauthn-rs = "0.6.2"
uuid = { version = "1", features = ["v5"] }
base64 = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
