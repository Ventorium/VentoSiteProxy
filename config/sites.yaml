# VentoSiteProxy 站点路由表
# 管理端每次保存都会原子覆盖此文件；手工编辑也会在约 2 秒内热生效。
version: 1

# 未匹配任何站点域名（Host）时的默认响应，三选一（默认 status）：
#   status  只返回 404 状态码 + "404 Not Found" 最小文本，不暴露任何信息
#   page    内置通用 404 页面（不含 Host / 服务名 / 版本）
#   custom  使用下方 custom_404_dir 目录里自定义的 404.html 等文件
#           （请求 /style.css 等路径时优先精确命中该目录下的文件，未命中回退 404.html）
default_404: status

# custom 模式使用的文件目录（相对二进制工作目录或绝对路径），
# 目录里放 404.html 及页面引用的 css / js / 图片等；目录缺失时回退内置页面
custom_404_dir: custom404

# 访问日志自动清理（默认开启，保留 180 天）：
# 日志按站点、按天归档为 logs/access/site-<id>-<slug>-<YYYYMMDD>.log，
# 每日自动删除归档日期早于 retention_days 天的文件；
# 无法解析日期的旧格式文件（site-<id>-<slug>.log）按文件修改时间判断。
log_cleanup:
  enabled: true
  retention_days: 180

sites:
  # 示例：普通 HTTP 站点
  - id: 1
    name: 示例站点
    notes: "演示用，可删除"
    enabled: true
    access_log: true
    domains:
      - "example.local"
    upstream: "127.0.0.1:8000"
    upstream_scheme: http
    # upstream_sni: "example.local"     # 仅 https 上游，留空自动
    verify_cert: false
    connect_timeout: 10      # 秒
    read_timeout: 0          # 0 = 不限（SSE / 长连接）
    write_timeout: 0         # 0 = 不限

    # location 级上游覆盖（按序匹配，path 命中后覆盖上游）
    locations: []
    #  - path: "/mqtt*"
    #    upstream: "192.168.1.127:8083"
    #    upstream_scheme: http
    #    connect_timeout: 604800
    #    read_timeout: 604800

    # URL 黑白名单（按序匹配，首个命中生效）
    url_rules: []
    #  黑名单模式示例（默认放行）：
    #  - pattern: "/api/v1/db*"
    #    action: deny          # /api/v1/db、/api/v1/db/health 全部 403
    #  - pattern: "/api/v1/*"
    #    action: allow
    # 白名单模式示例：url_default: deny + 若干 allow 规则
    url_default: allow

streams:
  # 示例：TCP 透传
  - id: 1
    name: 示例数据流
    notes: "演示用，可删除"
    enabled: true
    listen: "0.0.0.0:8881"
    upstream: "127.0.0.1:9000"
