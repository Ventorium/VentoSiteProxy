<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VentoSiteProxy · 登录</title>
<style>
  :root{
    --background:#fafafa;--foreground:#18181b;--card:#ffffff;--muted-foreground:#71717a;
    --primary:#18181b;--primary-foreground:#fafafa;--border:#e4e4e7;--input:#e4e4e7;--destructive:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--background);color:var(--foreground)}
  .card{width:360px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--border);
        border-radius:12px;padding:28px 24px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  h1{font-size:18px;margin:0 0 4px;font-weight:600}
  .sub{font-size:13px;color:var(--muted-foreground);margin:0 0 20px}
  .field{margin-bottom:12px}
  label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
  input{width:100%;height:38px;padding:0 12px;border:1px solid var(--input);border-radius:6px;
       font-size:14px;background:#fff;outline:none;color:var(--foreground)}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(24,24,27,.08)}
  .btn{width:100%;height:40px;border:none;border-radius:6px;background:var(--primary);
       color:var(--primary-foreground);font-size:14px;font-weight:500;cursor:pointer}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .sep{display:flex;align-items:center;margin:16px 0 12px;color:var(--muted-foreground);font-size:12px}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--border)}
  .sep span{margin:0 10px}
  .btn-ghost{width:100%;height:40px;border:1px solid var(--input);border-radius:6px;background:#fff;
             color:var(--foreground);font-size:14px;font-weight:500;cursor:pointer}
  .btn-ghost:hover{background:var(--background)}
  .btn-ghost:disabled{opacity:.6;cursor:not-allowed}
  .err{color:var(--destructive);font-size:13px;min-height:18px;margin-top:10px;word-break:break-all}
  .hint{display:none;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;
        font-size:13px;line-height:1.5;padding:8px 10px;margin-bottom:12px;word-break:break-all}
  .btn-hint{border-color:#15803d;color:#15803d;font-weight:600}
  .foot{margin-top:14px;font-size:12px;color:var(--muted-foreground);text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>VentoSiteProxy</h1>
  <p class="sub">零信任访问 · 请登录后继续</p>
  <form id="form" autocomplete="on" novalidate>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn" id="submit" type="submit">登录</button>
  </form>
  <div class="hint" id="hint"></div>
  <div class="sep"><span>或</span></div>
  <button class="btn-ghost" id="passkey-btn" type="button">🔑 通行密钥登录（免密码）</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">登录成功后将返回原页面 · 会话有闲置/绝对超时</div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var next = params.get("next") || "";
  var errEl = document.getElementById("err");
  var btn = document.getElementById("submit");
  var pkBtn = document.getElementById("passkey-btn");
  var form = document.getElementById("form");
  var hintEl = document.getElementById("hint");
  var userEl = document.getElementById("username");

  // ---- 浏览器指纹（仅用于记住用户名 + 一键通行密钥，不是认证因素） ----
  // SHA-256(UA + 平台 + 语言 + 屏幕 + 像素比 + 核数 + 时区 + canvas)，
  // 无 SubtleCrypto 时退化为 FNV-1a（前缀 fnv1a_）
  function computeFingerprint() {
    var parts = [
      navigator.userAgent,
      navigator.platform || "",
      (navigator.languages || [navigator.language] || []).join(","),
      screen.width + "x" + screen.height + "@" + screen.colorDepth,
      String(window.devicePixelRatio || 1),
      String(navigator.hardwareConcurrency || 0),
      (Intl.DateTimeFormat().resolvedOptions().timeZone || ""),
      "tzOffset=" + new Date().getTimezoneOffset()
    ];
    var canvasPart = "canvas:na";
    try {
      var c = document.createElement("canvas");
      c.width = 280; c.height = 60;
      var ctx = c.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillStyle = "#f60";
      ctx.fillRect(2, 2, 8, 8);
      ctx.fillStyle = "#069";
      ctx.fillText("ventosite-fp", 12, 8);
      ctx.fillStyle = "rgba(102,204,0,0.7)";
      ctx.fillText("ventosite-fp", 14, 10);
      canvasPart = "canvas:" + c.toDataURL();
    } catch (e) {}
    var raw = parts.join("|") + "|" + canvasPart;
    function fnv(s) {
      var h = 0x811c9dc5;
      for (var i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return "fnv1a_" + h.toString(16).padStart(8, "0");
    }
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw)).then(function (buf) {
        var b = new Uint8Array(buf);
        var out = "";
        for (var i = 0; i < b.length; i++) out += b[i].toString(16).padStart(2, "0");
        return out;
      }).catch(function () { return fnv(raw); });
    }
    return Promise.resolve(fnv(raw));
  }
  var fpPromise = computeFingerprint();
  function fpOrNull() { return fpPromise.then(function (fp) { return fp || ""; }); }

  // 页面加载：问后端这个浏览器是否被记住 → 预填用户名 + 高亮一键通行密钥
  fpPromise.then(function (fp) {
    if (!fp) return null;
    return fetch("/__auth/hint", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fp: fp })
    });
  }).then(function (r) {
    if (!r) return null;
    return r.json().catch(function () { return null; });
  }).then(function (j) {
    if (j && j.ok && j.data && j.data.username) {
      var u = j.data.username;
      if (!userEl.value.trim()) userEl.value = u;
      hintEl.textContent = "已识别此浏览器，记住用户名「" + u + "」——点下方按钮一键通行密钥登录（需切换账号请先清空用户名）";
      hintEl.style.display = "block";
      pkBtn.textContent = "🔑 一键通行密钥登录（免密码）";
      pkBtn.classList.add("btn-hint");
    }
  }).catch(function () {});

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    if (!username || !password) {
      errEl.textContent = "请输入用户名和密码";
      return;
    }
    btn.disabled = true;
    errEl.textContent = "";
    var fp = await fpPromise;
    var url = "/__auth/login" + (next ? "?next=" + encodeURIComponent(next) : "");
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password, fp: fp || "" })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        var r = x.r, j = x.j;
        if (r.ok && j.ok) {
          var d = j.data || {};
          if (d.enroll_required && d.mfa_token) {
            location.replace("/__auth/enroll?token=" + encodeURIComponent(d.mfa_token) +
              "&next=" + encodeURIComponent(d.next || next || "/"));
          } else if (d.need_mfa && d.mfa_token) {
            location.replace("/__auth/mfa?token=" + encodeURIComponent(d.mfa_token) +
              "&next=" + encodeURIComponent(d.next || next || "/"));
          } else {
            var redirect = d.redirect || next || "/";
            if (redirect.indexOf("/") !== 0 || redirect.indexOf("//") === 0) redirect = "/";
            location.replace(redirect);
          }
        } else {
          errEl.textContent = (j && j.error) || ("登录失败 (HTTP " + r.status + ")");
          btn.disabled = false;
        }
      })
      .catch(function () {
        errEl.textContent = "网络错误，请重试";
        btn.disabled = false;
      });
  });

  // ---- 通行密钥免密登录（首因素，无需密码） ----
  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function toCredentialOptions(pk) {
    if (!pk) return pk;
    if (typeof pk.challenge === "string") pk.challenge = b64urlToBytes(pk.challenge);
    if (pk.user && typeof pk.user.id === "string") pk.user.id = b64urlToBytes(pk.user.id);
    var list = pk.excludeCredentials || pk.allowCredentials;
    if (list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i] && typeof list[i].id === "string") list[i].id = b64urlToBytes(list[i].id);
      }
    }
    return pk;
  }
  function webauthnError(e) {
    if (e && e.name === "NotAllowedError") return "已取消操作";
    if (e && e.name === "SecurityError") return "通行密钥需要在 HTTPS 安全环境且与绑定时的域名一致，请确认地址栏为 https 后重试";
    return (e && e.message) || "通行密钥认证失败";
  }

  pkBtn.addEventListener("click", async function () {
    var username = document.getElementById("username").value.trim();
    if (!username) {
      errEl.textContent = "请先输入用户名，再点击通行密钥登录";
      return;
    }
    pkBtn.disabled = true;
    errEl.textContent = "";
    var fp = await fpPromise;
    fetch("/__auth/passkey/login/begin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, next: next || "/", fp: fp || "" })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        var r = x.r, j = x.j;
        if (!(r.ok && j.ok)) throw new Error((j && j.error) || ("开始失败 (HTTP " + r.status + ")"));
        var d = j.data || {};
        return navigator.credentials.get({ publicKey: toCredentialOptions(d.public_key) }).then(function (cred) {
          if (!cred) throw new Error("未找到通行密钥，请重试");
          return fetch("/__auth/passkey/login/finish", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: d.challenge_token, credential: cred, fp: fp || "" })
          }).then(function (r2) { return r2.json().catch(function () { return {}; }).then(function (j2) { return { r: r2, j: j2 }; }); });
        });
      })
      .then(function (x) {
        var r = x.r, j = x.j;
        if (r.ok && j.ok) {
          var redirect = (j.data && j.data.redirect) || next || "/";
          if (redirect.indexOf("/") !== 0 || redirect.indexOf("//") === 0) redirect = "/";
          location.replace(redirect);
        } else {
          errEl.textContent = (j && j.error) || ("通行密钥登录失败 (HTTP " + r.status + ")");
          pkBtn.disabled = false;
        }
      })
      .catch(function (e) {
        errEl.textContent = webauthnError(e);
        pkBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
